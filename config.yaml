env: BipedalWalker-v3
max_episodes: 5000
max_steps: 1600
update_interval: 16384
mini_batch_size: 1024
epochs_per_update: 8
lr: 1.5e-4
gamma: 0.995
lam: 0.97
clip: 0.15
entropy_coef: 0.003
vf_coef: 0.8
laser_range: 2.0
laser_speed: 0.025
laser_activate_after: 200
hidden: 512
opencl_min_elements: 8096
compute_chain: opencl,aten
num_envs: 32
fps: 30
record_video_container: webm
reward:
  progress_coef: 0.15
  backward_coef: 0.05
  max_progress_bonus: 0.5
  fall_progress_scale: 0.25
  laser_survive_per_cs: 0.1
dashboard:
  enabled: true
  host: 0.0.0.0
  port: 8080
  board_fps: 5
  stats_path: runs/live_stats.json
